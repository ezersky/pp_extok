<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tokens to SCSS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Tokens to SCSS</h1>
  <p class="hint">
    Собирает по одному SCSS-файлу на каждый набор токенов (все Sets — Global/*, Theme/* и любые
    другие, какие есть в файле). Ссылки между токенами сохраняются как SCSS-переменные, а не
    разворачиваются в resolved-значения.
  </p>

  <button id="generate-btn" type="button" data-appearance="primary">Собрать SCSS-файлы</button>

  <div id="status">
    <span class="spinner" aria-hidden="true"></span>
    <span id="status-text"></span>
  </div>

  <div class="skeleton-list" id="skeleton-list">
    <div class="skeleton-item"></div>
    <div class="skeleton-item"></div>
    <div class="skeleton-item"></div>
  </div>

  <ul id="files"></ul>

  <button id="zip-btn" type="button" data-appearance="primary">Скачать всё одним .zip</button>

  <script type="module" src="ui.js"></script>
</body>
</html>
